<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <style>
    body {
      width: 280px;
      padding: 16px;
      font-family: 'Segoe UI', -apple-system, sans-serif;
      font-size: 14px;
      color: #323130;
      margin: 0;
    }
    h2 {
      font-size: 16px;
      margin: 0 0 12px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    h2 img {
      width: 24px;
      height: 24px;
      border-radius: 50%;
    }
    p {
      margin: 0 0 10px 0;
      line-height: 1.5;
    }
    .step {
      background: #f1f3f4;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 8px;
    }
    .step-num {
      font-weight: 700;
      color: #0078d4;
    }
    .supported {
      font-size: 12px;
      color: #605e5c;
      margin-top: 12px;
      padding-top: 8px;
      border-top: 1px solid #edebe9;
    }
  </style>
</head>
<body>
  <h2><img src="icons/button-icon.png" alt=""/> Email to vCard</h2>
  <p>Pour créer un contact vCard :</p>
  <div class="step">
    <span class="step-num">1.</span> Ouvrez <b>Gmail</b> ou <b>Outlook Web</b>
  </div>
  <div class="step">
    <span class="step-num">2.</span> Ouvrez un <b>email</b>
  </div>
  <div class="step">
    <span class="step-num">3.</span> Cliquez sur le bouton <b>vCard</b> qui apparaît
  </div>
  <p class="supported">Sites supportés : Gmail, Outlook.com, Office 365</p>
</body>
</html>
